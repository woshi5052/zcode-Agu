name: Daily A-Share Quant Update

on:
  schedule:
    # 交易日 15:30 北京时间 = 07:30 UTC (周一到周五)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:  # 手动触发
  push:
    branches: [master]
    paths:
      - 'daily_push.py'
      - 'runner.py'
      - 'strategies/**'
      - 'config/**'
      - 'data/**'

jobs:
  quant-update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Push
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python daily_push.py

      - name: Run Paper Trading
        run: |
          python paper_trade.py
          echo "模拟盘完成"

      - name: Commit Paper State
        run: |
          git config user.name "quant-bot"
          git config user.email "bot@ashare-quant.dev"
          git add position/paper_state.json position/paper_log.csv position/push_log.json
          # [修复 2026-09-22] predictions持久化: 此前reports/*.json被gitignore且不入库,
          # Actions每天覆盖后丢弃, 预测追踪/胜率统计从未真正积累
          git add -f reports/predictions.json 2>/dev/null || true
          git add -f reports/recommendations.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "📊 模拟盘 $(date +%Y-%m-%d)"
          git push
