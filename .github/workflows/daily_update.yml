name: Daily A-Share Quant Update

on:
  schedule:
    # 交易日 15:30 北京时间 = 07:30 UTC (周一到周五)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:  # 手动触发
  push:
    branches: [master]
    paths:
      - 'runner.py'
      - 'strategies/**'
      - 'config/**'
      - 'data/**'

jobs:
  quant-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run A-Share Quant
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python runner.py

      - name: Commit reports
        if: always()
        run: |
          git config user.name "quant-bot"
          git config user.email "bot@ashare-quant.dev"
          git add reports/ data/cache/ config/params.json
          git diff --staged --quiet || git commit -m "📊 Daily update $(date +%Y-%m-%d)"
          git push
