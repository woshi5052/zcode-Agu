name: Monthly Backtest & Health Check

on:
  schedule:
    # 每月1号 08:00 UTC (16:00 北京时间)
    - cron: '0 8 1 * *'
  workflow_dispatch:  # 手动触发

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monthly Backtest (6-month window, 49支池)
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # [修复 2026-09-22] 旧版内联脚本用沪深300前50支, 与实际交易体系脱节
          # 现改为正式脚本: 49支低价股池(与推送/模拟盘/回测同口径), 数据联网拉取
          python scripts/monthly_check.py
